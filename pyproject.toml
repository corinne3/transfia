[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transfia"
version = "0.1.0"
description = "TransfIA : transformer des synthèses de recherche en élevage en contenus pédagogiques sourcés — un projet pour implémenter (et comprendre) tous les concepts clés de l'IA, en open source et sur CPU."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Corinne Bergès" }]
requires-python = ">=3.10"
# Socle minimal : tout ce qui est "from scratch" tourne avec ces dépendances légères.
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3",      # >= 1.3 pour HDBSCAN intégré
    "pydantic>=2.5",
    "pyyaml>=6",
    "requests>=2.31",
    "jinja2>=3.1",
    "networkx>=3.2",
    "pypdf>=4",
]

[project.optional-dependencies]
# Modèles locaux légers (CPU) : embeddings e5, reranker, base vectorielle Qdrant locale, parsing PyMuPDF
local = ["sentence-transformers>=3", "qdrant-client>=1.9", "pymupdf>=1.24"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]
obs = ["psutil>=5.9", "codecarbon>=2.5"]
phoenix = ["arize-phoenix>=4", "opentelemetry-sdk>=1.24", "opentelemetry-exporter-otlp>=1.24"]
docling = ["docling>=2"]
ner = ["gliner>=0.2"]
nli = ["transformers>=4.40"]
agents = ["langgraph>=0.2"]
cloud = ["litellm>=1.40"]
eval = ["ragas>=0.2"]
viz = ["matplotlib>=3.8", "umap-learn>=0.5"]
# Installation recommandée pour un PC de 8 Go sous Windows (voir docs/GUIDE_WEEKEND.md)
recommended = [
    "sentence-transformers>=3", "qdrant-client>=1.9", "pymupdf>=1.24",
    "fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2", "pytest>=8",
    "psutil>=5.9", "codecarbon>=2.5", "matplotlib>=3.8",
]

[project.scripts]
transfia = "transfia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
