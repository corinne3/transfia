# Intégration continue : tests + "eval gate" (une baisse de qualité de la recherche bloque le merge).
name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp,api]" httpx
      - run: pytest
      - run: python scripts/eval_gate.py --min-recall 0.9
